[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emojilibro"
version = "0.1.0"
description = "Convierte libros EPUB en una versión visual con emojis según el contexto."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "spacy>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
emojilibro = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
